name: Bug report
description: Something in Wattzup does not work as the requirements say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not report a security vulnerability here; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server and pedal to wake the bike
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Name the requirement in docs/specs/L2.md if you know it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bluetooth (finding, connecting, packets)
        - Dashboard
        - Workouts or resistance
        - Prototype (echelon_server.py, index.html)
        - End-to-end tests
        - Documentation, mocks or design system
        - Build or CI
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Bike model, operating system and Bluetooth adapter, browser and version, and the commit you ran.
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic recording, logs or screenshots
      description: >-
        For a bike that will not connect, report pedalling or take a target resistance: open the app with
        ?diagnose on the end of its address, reproduce the problem, press Recording, note what the bike's own
        display reads, and Save files. Paste the lines of the saved telo-ride-1-recording file around the
        problem, or attach it. It holds your bike's name and identifier; see docs/protocol/diagnostic-recording.md.
      render: text
