<div class="connect">
  <header class="connect__header">
    <wz-lockup />
    <wz-fullscreen-button />
  </header>
  <main id="main" class="connect__body" tabindex="-1">
    <div class="connect__media">
      <img
        class="connect__photo"
        src="machines/echelon-ex5s.jpg"
        alt="An Echelon EX-5s bike"
        width="800"
        height="800"
      />
    </div>
    <div class="connect__content">
      <h1 class="connect__title">Connect your bike</h1>
      <p class="connect__lead">
        Pedal once to wake it up. Telo Ride 1 reads your power and sets resistance for every hill
        and interval.
      </p>
      @if (alert(); as why) {
        <wz-connect-blocker
          [icon]="why.icon"
          [title]="why.title"
          [body]="why.body"
          [action]="why.way === 'secure' ? 'Open over HTTPS' : 'Try again'"
          [href]="why.way === 'secure' ? support.secureUrl() : null"
          (retry)="why.way === 'pair' ? store.pair() : support.recheck()"
        />
      } @else {
        <div class="connect__pair">
          <wz-connect-device
            [name]="device().name"
            [identifier]="device().identifier"
            [state]="device().state"
          />
          <button
            wz-button
            variant="primary"
            size="xl"
            [block]="true"
            type="button"
            class="connect__pair-btn"
            [disabled]="action().disabled"
            [attr.aria-busy]="action().busy || null"
            (click)="store.pair()"
          >
            @if (store.view().kind === 'pairing') {
              <svg class="icon icon--lg icon--spin" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
            }
            {{ action().label }}
          </button>
        </div>
      }
      <wz-connect-works [bikes]="bikes" />
    </div>
  </main>
</div>
