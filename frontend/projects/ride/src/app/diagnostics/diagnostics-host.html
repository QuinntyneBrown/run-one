<!-- prettier-ignore -->
<button wz-diagnostic-mark type="button" aria-haspopup="dialog" [screen]="screen()" [busy]="capturing()" (click)="show(dialog)">{{ capturing() ? 'Capturing…' : 'Recording' }}</button>
<dialog
  #dialog
  class="diagnostic-dialog"
  aria-labelledby="diagnostic-title"
  (close)="open.set(false)"
>
  @if (open()) {
    <wz-diagnostic-panel
      [entries]="recording.entries()"
      [dropped]="recording.dropped()"
      [since]="since"
      [canCapture]="screenCapture.supported"
      [status]="status()"
      (note)="addNote($event)"
      (capture)="capture(dialog)"
      (save)="save()"
      (closed)="dialog.close()"
    />
  }
</dialog>
