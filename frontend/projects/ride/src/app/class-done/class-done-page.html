@if (view; as view) {
  <wz-class-done
    [title]="view.title"
    [output]="view.output"
    [time]="view.time"
    [average]="view.average"
    [onTarget]="view.onTarget"
    [verdict]="view.verdict"
    [best]="view.best"
    [bestFact]="view.bestFact"
    [efforts]="view.efforts"
    [saved]="view.saved"
  >
    <wz-fullscreen-button slot="end" />
    @if (question(); as question) {
      <wz-intensity-question
        slot="question"
        [intensity]="question.intensity"
        [current]="question.current"
        [answer]="answer()"
        (keep)="keep()"
        (dismiss)="dismiss()"
      />
    }
    <a
      wz-button
      slot="actions"
      variant="primary"
      size="xl"
      [block]="true"
      routerLink="/"
      class="class-done-page__done"
      >Done</a
    >
  </wz-class-done>
}
