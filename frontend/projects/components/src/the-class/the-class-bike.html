@if (connected()) {
  <svg class="icon icon--md the-class__bike-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m7 7 10 10-5 5V2l5 5L7 17" />
  </svg>
} @else {
  <svg
    class="icon icon--md the-class__bike-icon the-class__bike-icon--off"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path d="m17 17-5 5V12l-5 5" />
    <path d="m2 2 20 20" />
    <path d="M14.5 9.5 17 7l-5-5v4.5" />
  </svg>
}
<span class="the-class__bike-name"
  ><ng-content />
  @if (connected()) {
    <span class="visually-hidden"> connected</span>
  }
</span>
<span class="the-class__bike-action">&nbsp;· {{ connected() ? 'Change' : 'Connect' }}</span>
