<div class="ride-with">
  <h2 class="ride-with__title" id="ride-with">Ride with</h2>
  <div class="ride-with__options" role="radiogroup" aria-labelledby="ride-with">
    @for (option of options(); track option.way; let index = $index) {
      <button
        class="ride-with__option"
        type="button"
        role="radio"
        [attr.aria-checked]="option.way === chosen()"
        [attr.aria-disabled]="option.disabled ? 'true' : null"
        [tabIndex]="option.way === chosen() ? 0 : -1"
        (click)="pick(option)"
        (keydown)="move($event, index)"
      >
        <span class="ride-with__mark" aria-hidden="true"></span>
        <span class="ride-with__text"
          ><span class="ride-with__name">{{ option.name }}</span>
          @if (option.detail; as detail) {
            <span class="ride-with__detail">{{ detail }}</span>
          }
        </span>
      </button>
    }
  </div>
</div>
