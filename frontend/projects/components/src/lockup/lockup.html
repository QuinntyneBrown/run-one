<span
  class="lockup"

  aria-label="Telo Ride 1"
>
  <svg class="logo-mark" width="26" height="26" viewBox="0 0 48 48" aria-hidden="true">
    <path class="logo-mark__ring" d="M37.79 21.57 A14 14 0 1 1 26.43 10.21" />
    <path class="logo-mark__crank" d="M24 24 L38 10" />
    <circle class="logo-mark__hub" cx="24" cy="24" r="4.6" />
  </svg>
  <span class="wordmark" aria-hidden="true">TELO<span class="wordmark__product">Ride 1</span></span>
</span>
